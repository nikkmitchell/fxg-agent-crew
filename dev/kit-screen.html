<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Kit screen preview</title>
<style>html, body { margin: 0; height: 100%; background: #1b1f26; overflow: hidden; }</style>
</head>
<body>
<!-- A screen from the space kit (src/kit/screen.ts) in a plain three.js scene. -->
<script type="module">
  import * as THREE from "three";
  import { openScreen } from "/src/kit/screen.ts";
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1f26);
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);
  const params = new URLSearchParams(location.search);
  camera.position.set(Number(params.get("cx") ?? 0.9), 1.5, 1.4);
  camera.lookAt(0, 1.4, -1.5);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshBasicMaterial({ color: 0x2a303a }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshNormalMaterial());
  cube.position.set(-1.2, 1, -1);
  scene.add(cube);
  const screen = openScreen({ scene, camera, renderer, url: params.get("url") ?? "/dev/dawn-preview.html", at: [0, 1.4, -1.5], facing: 0.25, title: "A space" });
  Object.assign(window, { screen, scene, camera, renderer });
  renderer.setAnimationLoop(() => {
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
