# nginx site for saha.ing: Mission Control at /, robots.txt from disk.
#
# Node owns `/` deliberately, and reserves /api/ itself — see the note below.
#
# INSTALL THIS SECOND. It references certificate files, so on a host with no
# certificate yet `nginx -t` fails and nginx will not start — which blocks the
# ACME challenge that would create the certificate. Use nginx.bootstrap.conf
# first, obtain the cert, then install this. See deploy/README.md.
#
# NOTE: `location /` below is deliberate now. An earlier version used it when
# this host also had to leave room for chat, which would have captured
# the existing chat rather than sitting beside it — the opposite of the product
# contract. The location blocks below are deliberately prefix-scoped, and
# release.sh asserts that an unrelated path is NOT proxied.
#
# Install: /etc/nginx/sites-available/fxg-crew  (symlink into sites-enabled)
# Replace SERVER_NAME_HERE before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `http2 on;` is nginx >= 1.25.1 only. Ubuntu 24.04 ships 1.24.0, where that
    # directive is unknown and `nginx -t` fails outright — so the per-listener
    # form is used instead. It is understood by both, which matters because the
    # failure mode of the newer syntax here is a config that will not load at
    # all rather than one that quietly drops HTTP/2.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME_HERE;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME_HERE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Short max-age to start. Raise it only once renewal is proven — HSTS is
    # hard to walk back, and a stuck certificate plus a long max-age locks
    # people out of the site entirely.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    # THE FRONT DOOR IS THE APP.
    #
    # This used to serve a static landing page from disk at `/`, with Mission
    # Control proxied under /space. The mount existed so this service could
    # share an origin with classic chat without capturing its routes. Chat is
    # on its own domain now, so what was left at `/` was a page whose entire
    # content was a link to the real page — a click and a round trip charged to
    # every visitor for nothing.
    #
    # The isolation that mount provided has not been dropped, it has moved: the
    # Node service reserves /api/ itself and answers 404 there, so putting
    # something else on this origin later cannot be silently captured.
    root /var/www/saha;

    # robots.txt stays on disk. It is a fact about the deployment rather than
    # part of the application, and it must keep answering even when the service
    # is down — a crawler that gets a 502 learns nothing about whether it may
    # index this host.
    location = /robots.txt { try_files /robots.txt =404; }

    # Everything else is the app.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The long-poll holds a request open for up to 30s. Buffering would
        # withhold the response until the body completed, defeating it entirely
        # — the feature would appear to work while being useless.
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Old links. Mission Control lived under /space until 2026-09-10, so
    # anything bookmarked then still lands somewhere useful rather than on a
    # 404 that looks like the site is gone.
    location = /space  { return 301 /; }
    location /space/   { rewrite ^/space/(.*)$ /$1 permanent; }
}
