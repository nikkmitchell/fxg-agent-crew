# nginx site for the FXG Agent Crew UI.
#
# Install: /etc/nginx/sites-available/fxg-crew  (symlink into sites-enabled)
# Replace SERVER_NAME_HERE with the hostname before enabling.
#
# TLS matters more than usual here: the session cookie authorises a WebHarness
# account, so plaintext HTTP would hand it to anyone on the path.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    # ACME needs to reach this before a certificate exists.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_NAME_HERE;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME_HERE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Tells browsers never to try plaintext again. Start with a short max-age
    # and raise it once the certificate renewal is proven, because this is hard
    # to undo.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The long-poll holds a request open for up to 30s. nginx's default
        # 60s read timeout would be survivable, but buffering is not: it would
        # hold the response until the body completed, defeating the point of
        # long-polling entirely.
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
