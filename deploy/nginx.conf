# nginx site for saha.ing: front door at /, Mission Control at /space.
#
# CRITICAL: it proxies ONLY /space to Node. Node must never own `/`.
#
# INSTALL THIS SECOND. It references certificate files, so on a host with no
# certificate yet `nginx -t` fails and nginx will not start — which blocks the
# ACME challenge that would create the certificate. Use nginx.bootstrap.conf
# first, obtain the cert, then install this. See deploy/README.md.
#
# An earlier version of this file used `location /`, which would have captured
# the existing chat rather than sitting beside it — the opposite of the product
# contract. The location blocks below are deliberately prefix-scoped, and
# release.sh asserts that an unrelated path is NOT proxied.
#
# Install: /etc/nginx/sites-available/fxg-crew  (symlink into sites-enabled)
# Replace SERVER_NAME_HERE before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_NAME_HERE;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME_HERE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Short max-age to start. Raise it only once renewal is proven — HSTS is
    # hard to walk back, and a stuck certificate plus a long max-age locks
    # people out of the site entirely.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    # THE FRONT DOOR. Served by nginx from disk — never proxied to Node.
    #
    # This is the reconciliation of two things that sound contradictory: the
    # product wants https://saha.ing/ to be a real landing page, and the Node
    # service must NOT own the root path. Both hold, because they are different
    # servers. nginx answers `/` from /var/www/saha; Node still returns 404 for
    # `/` on loopback, and release.sh still asserts exactly that.
    #
    # If the landing page is ever removed, this must go back to `return 404` —
    # it must never fall through to proxy_pass.
    root /var/www/saha;
    index index.html;

    location = / { try_files /index.html =404; }

    # Chat lives on Wilson's existing deployment, not here. Anything else above
    # /space is not ours to answer.
    location / { return 404; }

    location /space/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The long-poll holds a request open for up to 30s. Buffering would
        # withhold the response until the body completed, defeating it entirely
        # — the feature would appear to work while being useless.
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Bare /space with no trailing slash.
    location = /space { return 301 /space/; }
}
