<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>saha.ing is restarting</title>
<!--
  Served by nginx from /var/www/saha when the app does not answer for a moment:
  a deploy restarts it, and a page asked for in that second used to get nginx's
  bare "502 Bad Gateway" (seen 2026-10-23 01:27:45). This tries again by itself.
  No scripts or styles from anywhere else: the app that serves them is the thing
  that is down.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 system-ui, sans-serif; background: #f2efe5; color: #222321; }
  @media (prefers-color-scheme: dark) { body { background: #141517; color: #ece9e1; } }
  p { margin: 0 16px; text-align: center; }
</style>
</head>
<body>
<p>saha.ing is restarting. This page will come back by itself in a moment.</p>
<script>
  // 2 s, then twice as long each time up to 30 s, so a crash loop is not a page
  // reloading every two seconds for ever (Nightjar's review). The count is kept
  // in this tab's storage, not the address, and starts again after a quiet minute.
  var key = "saha.restarting", now = Date.now(), tries = 0;
  try {
    var last = JSON.parse(sessionStorage.getItem(key) || "null");
    if (last && now - last.at < 60000) tries = last.tries + 1;
    sessionStorage.setItem(key, JSON.stringify({ tries: tries, at: now }));
  } catch (e) { tries = 2; }
  setTimeout(function () { location.reload(); }, Math.min(30000, 2000 * Math.pow(2, tries)));
</script>
</body>
</html>
