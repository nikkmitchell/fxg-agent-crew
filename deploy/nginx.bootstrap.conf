# HTTP-ONLY bootstrap site. Use this FIRST, before any certificate exists.
#
# Why this file exists: the final config (nginx.conf) references
# /etc/letsencrypt/live/SERVER_NAME_HERE/fullchain.pem. On a host that has
# never run certbot, that file does not exist, so `nginx -t` fails and nginx
# will not start — which means certbot's webroot challenge cannot be served,
# which means the certificate can never be issued. A deadlock that presents as
# "nginx is broken" rather than as "you did these in the wrong order".
#
# So: install THIS, get the certificate, then install nginx.conf.
#
# Install: /etc/nginx/sites-available/fxg-crew  (symlink into sites-enabled)
# Replace SERVER_NAME_HERE before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    # The only thing this config exists to serve.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Everything else is deliberately unavailable during bootstrap. No redirect
    # to https:// here — there is no certificate yet, so a redirect would send
    # visitors to a port that cannot answer. 503 is the honest status: the
    # service exists and is not ready.
    location / { return 503 "not yet configured\n"; }
}
